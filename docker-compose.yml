services:
  db:
    image: postgres:18
    container_name: wrapit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      # Postgres 18+ moved the declared VOLUME to /var/lib/postgresql (was /var/lib/postgresql/data in 17 and below).
      # SEE: https://hub.docker.com/_/postgres
      - wrapit_pgdata:/var/lib/postgresql

volumes:
  wrapit_pgdata:
